openapi: 3.1.0
info:
  title: Max Flow Optimizer API
  version: 1.0.0
  description: API v1 para resolver asignacion de feriados por flujo maximo, historial local y optimizacion opcional.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Healthcheck
      operationId: getHealth
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "./schemas/health.response.schema.json"
  /v1/solve:
    post:
      summary: Resolve one assignment instance with optional optimization
      operationId: solveInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/solve.request.schema.json"
      responses:
        "200":
          description: Solved (feasible or infeasible)
          content:
            application/json:
              schema:
                $ref: "./schemas/solve.response.schema.json"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "./schemas/error.schema.json"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "./schemas/error.schema.json"
  /v1/runs:
    get:
      summary: List persisted solve runs
      operationId: listRuns
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [feasible, infeasible, error]
        - name: instanceId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Run history page
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "./schemas/error.schema.json"
  /v1/runs/{runId}:
    get:
      summary: Get one persisted solve run
      operationId: getRun
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Run detail
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "./schemas/error.schema.json"
